<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clippy Q&A - Admin Edition</title>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        const { useState, useEffect } = React;

        const ClippyQAAdmin = () => {
            // Data state
            const [categories, setCategories] = useState([
                { id: "general", name: "General Questions", icon: "🤔" },
                { id: "technical", name: "Technical Support", icon: "⚙️" },
                { id: "account", name: "Account & Billing", icon: "💳" },
                { id: "features", name: "Features & Usage", icon: "✨" }
            ]);

            const [qaItems, setQaItems] = useState([
                {
                    id: 1,
                    category: "general",
                    question: "What is this application?",
                    answer: "This is a Q&A chatbot application built to provide quick answers.",
                    keyPhrases: ["what, app, application"],
                    description: "Overview of the application"
                },
                {
                    id: 2,
                    category: "features",
                    question: "How do I search for questions?",
                    answer: "Use the search box to find questions by keyword. Results update in real-time.",
                    keyPhrases: ["search, find, look for"],
                    description: "How to use the search feature"
                }
            ]);

            // UI state
            const [viewMode, setViewMode] = useState('chat'); // 'chat', 'list', 'admin'
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('all');
            const [chatMessages, setChatMessages] = useState([]);
            const [chatInput, setChatInput] = useState('');
            const [expandedItems, setExpandedItems] = useState({});

            // Form states
            const [newCategory, setNewCategory] = useState({ name: '', icon: '' });
            const [newQA, setNewQA] = useState({
                question: '',
                answer: '',
                description: '',
                keyPhrases: '',
                category: categories[0]?.id || 'general'
            });
            const [nextId, setNextId] = useState(3);

            // Initialize chat
            useEffect(() => {
                setChatMessages([{
                    type: 'bot',
                    text: 'Hi! I\'m Clippy. Ask me any question or browse questions below.'
                }]);
            }, []);

            // Filter items
            const getFilteredItems = () => {
                let filtered = qaItems;
                if (selectedCategory !== 'all') {
                    filtered = filtered.filter(item => item.category === selectedCategory);
                }
                if (searchTerm) {
                    const term = searchTerm.toLowerCase();
                    filtered = filtered.filter(item =>
                        item.question.toLowerCase().includes(term) ||
                        item.answer.toLowerCase().includes(term) ||
                        item.description.toLowerCase().includes(term) ||
                        (item.keyPhrases && item.keyPhrases.toLowerCase().includes(term))
                    );
                }
                return filtered;
            };

            // Find answer (includes key phrases)
            const findAnswer = (userInput) => {
                const input = userInput.toLowerCase();
                let bestMatch = null;
                let bestScore = 0;

                qaItems.forEach(item => {
                    let score = 0;
                    if (item.question.toLowerCase().includes(input)) score += 3;
                    if (item.keyPhrases && item.keyPhrases.toLowerCase().includes(input)) score += 2;
                    if (item.description.toLowerCase().includes(input)) score += 1;
                    if (item.answer.toLowerCase().includes(input)) score += 1;

                    if (score > bestScore) {
                        bestScore = score;
                        bestMatch = item;
                    }
                });

                return bestMatch ? bestMatch.answer : "I couldn't find an answer to that question. Try different keywords or browse by category.";
            };

            // Chat submit
            const handleChatSubmit = (e) => {
                e.preventDefault();
                if (!chatInput.trim()) return;

                const newMessages = [...chatMessages, { type: 'user', text: chatInput }];
                const answer = findAnswer(chatInput);
                newMessages.push({ type: 'bot', text: answer });

                setChatMessages(newMessages);
                setChatInput('');
            };

            // Add category
            const handleAddCategory = (e) => {
                e.preventDefault();
                if (!newCategory.name.trim()) return;

                const id = newCategory.name.toLowerCase().replace(/\s+/g, '_');
                setCategories([...categories, {
                    id,
                    name: newCategory.name,
                    icon: newCategory.icon || '📌'
                }]);
                setNewCategory({ name: '', icon: '' });
                alert('✅ Category added!');
            };

            // Add Q&A
            const handleAddQA = (e) => {
                e.preventDefault();
                if (!newQA.question.trim() || !newQA.answer.trim()) return;

                setQaItems([...qaItems, {
                    id: nextId,
                    category: newQA.category,
                    question: newQA.question,
                    answer: newQA.answer,
                    description: newQA.description,
                    keyPhrases: newQA.keyPhrases
                }]);
                setNextId(nextId + 1);
                setNewQA({
                    question: '',
                    answer: '',
                    description: '',
                    keyPhrases: '',
                    category: categories[0]?.id || 'general'
                });
                alert('✅ Q&A item added!');
            };

            // Delete Q&A
            const handleDeleteQA = (id) => {
                if (confirm('Are you sure you want to delete this Q&A?')) {
                    setQaItems(qaItems.filter(item => item.id !== id));
                    alert('✅ Q&A deleted!');
                }
            };

            // Export data
            const handleExport = () => {
                const data = { categories, qaItems };
                const json = JSON.stringify(data, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `clippy-qa-backup-${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                alert('✅ Data exported!');
            };

            // Import data
            const handleImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const imported = JSON.parse(event.target.result);
                        if (imported.categories) setCategories(imported.categories);
                        if (imported.qaItems) {
                            setQaItems(imported.qaItems);
                            const maxId = Math.max(...imported.qaItems.map(item => item.id), 0);
                            setNextId(maxId + 1);
                        }
                        alert('✅ Data imported!');
                    } catch (error) {
                        alert('❌ Error importing file. Make sure it\'s valid JSON.');
                    }
                };
                reader.readAsText(file);
            };

            const filteredItems = getFilteredItems();

            return React.createElement('div', { className: 'min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100' },
                // Header
                React.createElement('header', { className: 'bg-white shadow-md border-b-4 border-indigo-600 sticky top-0 z-50' },
                    React.createElement('div', { className: 'max-w-7xl mx-auto px-6 py-4' },
                        React.createElement('div', { className: 'flex items-center justify-between' },
                            React.createElement('div', { className: 'flex items-center gap-3' },
                                React.createElement('div', { className: 'text-3xl' }, '📎'),
                                React.createElement('h1', { className: 'text-2xl font-bold text-indigo-600' }, 'Clippy Q&A')
                            ),
                            React.createElement('div', { className: 'flex gap-2' },
                                React.createElement('button', {
                                    onClick: () => setViewMode('chat'),
                                    className: `px-4 py-2 rounded-lg transition-all ${viewMode === 'chat' ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`
                                }, '💬 Chat'),
                                React.createElement('button', {
                                    onClick: () => setViewMode('list'),
                                    className: `px-4 py-2 rounded-lg transition-all ${viewMode === 'list' ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`
                                }, '📋 Browse'),
                                React.createElement('button', {
                                    onClick: () => setViewMode('admin'),
                                    className: `px-4 py-2 rounded-lg transition-all ${viewMode === 'admin' ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`
                                }, '⚙️ Admin')
                            )
                        )
                    )
                ),

                // Main Content
                React.createElement('main', { className: 'max-w-7xl mx-auto px-6 py-8' },
                    // Search (visible in chat and list modes)
                    (viewMode === 'chat' || viewMode === 'list') && React.createElement('div', { className: 'mb-6' },
                        React.createElement('div', { className: 'flex items-center gap-2 bg-white px-4 py-3 rounded-lg shadow-md border-2 border-indigo-200' },
                            React.createElement('span', null, '🔍'),
                            React.createElement('input', {
                                type: 'text',
                                placeholder: 'Search questions, key phrases, descriptions...',
                                value: searchTerm,
                                onChange: (e) => setSearchTerm(e.target.value),
                                className: 'flex-1 outline-none text-lg'
                            })
                        ),
                        searchTerm && React.createElement('p', { className: 'text-sm text-gray-600 mt-2' }, `Found ${filteredItems.length} result${filteredItems.length !== 1 ? 's' : ''}`)
                    ),

                    // Category Filter (list mode)
                    viewMode === 'list' && React.createElement('div', { className: 'mb-6 flex flex-wrap gap-2' },
                        React.createElement('button', {
                            onClick: () => setSelectedCategory('all'),
                            className: `px-4 py-2 rounded-full transition-all font-medium ${selectedCategory === 'all' ? 'bg-indigo-600 text-white' : 'bg-white text-gray-700 border-2 border-indigo-200 hover:border-indigo-600'}`
                        }, 'All Topics'),
                        categories.map(cat =>
                            React.createElement('button', {
                                key: cat.id,
                                onClick: () => setSelectedCategory(cat.id),
                                className: `px-4 py-2 rounded-full transition-all font-medium ${selectedCategory === cat.id ? 'bg-indigo-600 text-white' : 'bg-white text-gray-700 border-2 border-indigo-200 hover:border-indigo-600'}`
                            }, `${cat.icon} ${cat.name}`)
                        )
                    ),

                    // CHAT MODE
                    viewMode === 'chat' && React.createElement('div', { className: 'flex flex-col h-[600px] bg-white rounded-lg shadow-lg border-2 border-indigo-200 overflow-hidden' },
                        React.createElement('div', { className: 'flex-1 overflow-y-auto p-6 space-y-4' },
                            chatMessages.map((msg, idx) =>
                                React.createElement('div', {
                                    key: idx,
                                    className: `flex ${msg.type === 'user' ? 'justify-end' : 'justify-start'}`
                                },
                                    React.createElement('div', {
                                        className: `max-w-md px-4 py-3 rounded-lg ${msg.type === 'user' ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-gray-100 text-gray-800 rounded-bl-none'}`
                                    }, msg.text)
                                )
                            )
                        ),
                        React.createElement('form', { onSubmit: handleChatSubmit, className: 'border-t-2 border-indigo-200 p-4 bg-gray-50' },
                            React.createElement('div', { className: 'flex gap-2' },
                                React.createElement('input', {
                                    type: 'text',
                                    value: chatInput,
                                    onChange: (e) => setChatInput(e.target.value),
                                    placeholder: 'Ask a question...',
                                    className: 'flex-1 px-4 py-2 border-2 border-indigo-200 rounded-lg focus:outline-none focus:border-indigo-600'
                                }),
                                React.createElement('button', {
                                    type: 'submit',
                                    className: 'bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 transition-colors font-medium'
                                }, '✉️ Send')
                            )
                        )
                    ),

                    // LIST MODE
                    viewMode === 'list' && React.createElement('div', { className: 'space-y-3' },
                        filteredItems.length > 0 ? (
                            filteredItems.map(item =>
                                React.createElement('div', {
                                    key: item.id,
                                    className: 'bg-white rounded-lg shadow-md border-2 border-indigo-200 overflow-hidden hover:shadow-lg transition-shadow'
                                },
                                    React.createElement('button', {
                                        onClick: () => setExpandedItems(prev => ({ ...prev, [item.id]: !prev[item.id] })),
                                        className: 'w-full px-6 py-4 flex items-center justify-between hover:bg-indigo-50 transition-colors'
                                    },
                                        React.createElement('div', { className: 'text-left' },
                                            React.createElement('p', { className: 'font-semibold text-gray-800 text-lg' }, item.question),
                                            React.createElement('p', { className: 'text-sm text-indigo-600 mt-1' }, categories.find(c => c.id === item.category)?.name)
                                        ),
                                        React.createElement('span', { className: 'text-indigo-600' }, expandedItems[item.id] ? '▲' : '▼')
                                    ),
                                    expandedItems[item.id] && React.createElement('div', { className: 'border-t-2 border-indigo-200 px-6 py-4 bg-indigo-50 space-y-3' },
                                        React.createElement('div', null,
                                            React.createElement('p', { className: 'text-gray-700 font-semibold mb-2' }, 'Answer:'),
                                            React.createElement('p', { className: 'text-gray-700' }, item.answer)
                                        ),
                                        item.description && React.createElement('div', null,
                                            React.createElement('p', { className: 'text-gray-600 text-sm' }, '📝 ', item.description)
                                        ),
                                        item.keyPhrases && React.createElement('div', null,
                                            React.createElement('p', { className: 'text-gray-600 text-sm' }, '🔑 Key phrases: ', item.keyPhrases)
                                        )
                                    )
                                )
                            )
                        ) : (
                            React.createElement('div', { className: 'text-center py-12' },
                                React.createElement('p', { className: 'text-xl text-gray-600' }, 'No questions match your search.')
                            )
                        )
                    ),

                    // ADMIN MODE
                    viewMode === 'admin' && React.createElement('div', { className: 'grid grid-cols-1 lg:grid-cols-2 gap-6' },
                        // Add Category Section
                        React.createElement('div', { className: 'bg-white rounded-lg shadow-lg border-2 border-indigo-200 p-6' },
                            React.createElement('h2', { className: 'text-2xl font-bold text-indigo-600 mb-4' }, '➕ Add New Category'),
                            React.createElement('form', { onSubmit: handleAddCategory, className: 'space-y-4' },
                                React.createElement('input', {
                                    type: 'text',
                                    placeholder: 'Category name (e.g., Troubleshooting)',
                                    value: newCategory.name,
                                    onChange: (e) => setNewCategory({ ...newCategory, name: e.target.value }),
                                    className: 'w-full px-4 py-2 border-2 border-indigo-200 rounded-lg focus:outline-none focus:border-indigo-600'
                                }),
                                React.createElement('input', {
                                    type: 'text',
                                    placeholder: 'Emoji icon (e.g., 🐛)',
                                    value: newCategory.icon,
                                    onChange: (e) => setNewCategory({ ...newCategory, icon: e.target.value }),
                                    className: 'w-full px-4 py-2 border-2 border-indigo-200 rounded-lg focus:outline-none focus:border-indigo-600',
                                    maxLength: '2'
                                }),
                                React.createElement('button', {
                                    type: 'submit',
                                    className: 'w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition-colors font-bold'
                                }, '✅ Add Category')
                            ),
                            React.createElement('div', { className: 'mt-6' },
                                React.createElement('h3', { className: 'font-bold text-gray-700 mb-2' }, 'Current Categories:'),
                                React.createElement('div', { className: 'space-y-1' },
                                    categories.map(cat =>
                                        React.createElement('div', {
                                            key: cat.id,
                                            className: 'bg-gray-100 px-3 py-2 rounded text-sm'
                                        }, `${cat.icon} ${cat.name}`)
                                    )
                                )
                            )
                        ),

                        // Add Q&A Section
                        React.createElement('div', { className: 'bg-white rounded-lg shadow-lg border-2 border-indigo-200 p-6' },
                            React.createElement('h2', { className: 'text-2xl font-bold text-indigo-600 mb-4' }, '➕ Add New Q&A'),
                            React.createElement('form', { onSubmit: handleAddQA, className: 'space-y-4' },
                                React.createElement('select', {
                                    value: newQA.category,
                                    onChange: (e) => setNewQA({ ...newQA, category: e.target.value }),
                                    className: 'w-full px-4 py-2 border-2 border-indigo-200 rounded-lg focus:outline-none focus:border-indigo-600'
                                },
                                    categories.map(cat =>
                                        React.createElement('option', { key: cat.id, value: cat.id }, cat.name)
                                    )
                                ),
                                React.createElement('textarea', {
                                    placeholder: 'Question',
                                    value: newQA.question,
                                    onChange: (e) => setNewQA({ ...newQA, question: e.target.value }),
                                    className: 'w-full px-4 py-2 border-2 border-indigo-200 rounded-lg focus:outline-none focus:border-indigo-600',
                                    rows: '2'
                                }),
                                React.createElement('textarea', {
                                    placeholder: 'Answer',
                                    value: newQA.answer,
                                    onChange: (e) => setNewQA({ ...newQA, answer: e.target.value }),
                                    className: 'w-full px-4 py-2 border-2 border-indigo-200 rounded-lg focus:outline-none focus:border-indigo-600',
                                    rows: '3'
                                }),
                                React.createElement('textarea', {
                                    placeholder: 'Description/Details (searchable)',
                                    value: newQA.description,
                                    onChange: (e) => setNewQA({ ...newQA, description: e.target.value }),
                                    className: 'w-full px-4 py-2 border-2 border-indigo-200 rounded-lg focus:outline-none focus:border-indigo-600',
                                    rows: '2'
                                }),
                                React.createElement('textarea', {
                                    placeholder: 'Key phrases (comma-separated, e.g.: install, setup, configuration)',
                                    value: newQA.keyPhrases,
                                    onChange: (e) => setNewQA({ ...newQA, keyPhrases: e.target.value }),
                                    className: 'w-full px-4 py-2 border-2 border-indigo-200 rounded-lg focus:outline-none focus:border-indigo-600',
                                    rows: '2'
                                }),
                                React.createElement('button', {
                                    type: 'submit',
                                    className: 'w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition-colors font-bold'
                                }, '✅ Add Q&A Item')
                            ),
                            React.createElement('div', { className: 'mt-4' },
                                React.createElement('p', { className: 'text-sm text-gray-600 mb-2' }, `Total Q&A Items: ${qaItems.length}`)
                            )
                        ),

                        // Export/Import Section
                        React.createElement('div', { className: 'lg:col-span-2 bg-white rounded-lg shadow-lg border-2 border-indigo-200 p-6' },
                            React.createElement('h2', { className: 'text-2xl font-bold text-indigo-600 mb-4' }, '💾 Data Management'),
                            React.createElement('div', { className: 'grid grid-cols-2 gap-4' },
                                React.createElement('button', {
                                    onClick: handleExport,
                                    className: 'bg-green-600 text-white py-3 rounded-lg hover:bg-green-700 transition-colors font-bold'
                                }, '⬇️ Export Data'),
                                React.createElement('div', { className: 'relative' },
                                    React.createElement('label', { className: 'block w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition-colors font-bold text-center cursor-pointer' },
                                        '⬆️ Import Data',
                                        React.createElement('input', {
                                            type: 'file',
                                            accept: '.json',
                                            onChange: handleImport,
                                            className: 'hidden'
                                        })
                                    )
                                )
                            ),
                            React.createElement('p', { className: 'text-sm text-gray-600 mt-4' }, '💡 Export your Q&A data regularly as a backup. Import to restore or migrate data.')
                        ),

                        // Current Items Section
                        React.createElement('div', { className: 'lg:col-span-2 bg-white rounded-lg shadow-lg border-2 border-indigo-200 p-6' },
                            React.createElement('h2', { className: 'text-2xl font-bold text-indigo-600 mb-4' }, '📚 Current Q&A Items'),
                            React.createElement('div', { className: 'space-y-3 max-h-96 overflow-y-auto' },
                                qaItems.map(item =>
                                    React.createElement('div', {
                                        key: item.id,
                                        className: 'bg-gray-100 p-4 rounded-lg border-l-4 border-indigo-600'
                                    },
                                        React.createElement('div', { className: 'flex justify-between items-start' },
                                            React.createElement('div', { className: 'flex-1' },
                                                React.createElement('p', { className: 'font-semibold text-gray-800' }, item.question),
                                                React.createElement('p', { className: 'text-sm text-gray-600 mt-1' }, `Category: ${categories.find(c => c.id === item.category)?.name}`)
                                            ),
                                            React.createElement('button', {
                                                onClick: () => handleDeleteQA(item.id),
                                                className: 'ml-2 text-red-600 hover:text-red-800 font-bold text-lg'
                                            }, '🗑️')
                                        )
                                    )
                                )
                            )
                        )
                    )
                )
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(ClippyQAAdmin));
    </script>
</body>
</html>
