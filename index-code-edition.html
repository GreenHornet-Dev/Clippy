<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clippy Q&A - Code Edition</title>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        const { useState, useEffect } = React;

        const ClippyQACodeEdition = () => {
            // Data state with CODE field added
            const [categories, setCategories] = useState([
                { id: "general", name: "General Questions", icon: "🤔" },
                { id: "technical", name: "Technical Support", icon: "⚙️" },
                { id: "account", name: "Account & Billing", icon: "💳" },
                { id: "features", name: "Features & Usage", icon: "✨" }
            ]);

            const [qaItems, setQaItems] = useState([
                {
                    id: 1,
                    category: "general",
                    question: "What is this application?",
                    answer: "This is a Q&A chatbot with code storage capabilities.",
                    keyPhrases: ["what, app, application"],
                    description: "Overview of the application",
                    code: "// This Q&A can store code snippets\nconsole.log('Clippy Q&A with Code Edition');"
                },
                {
                    id: 2,
                    category: "features",
                    question: "How do I store code with questions?",
                    answer: "Each Q&A item can include code snippets, JavaScript, or any type of script.",
                    keyPhrases: ["code, script, javascript"],
                    description: "How to use the code field",
                    code: "// Example: Store installation commands\nnpm install my-package\nnpm start"
                }
            ]);

            // UI state
            const [viewMode, setViewMode] = useState('chat');
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('all');
            const [chatMessages, setChatMessages] = useState([]);
            const [chatInput, setChatInput] = useState('');
            const [expandedItems, setExpandedItems] = useState({});
            const [copiedId, setCopiedId] = useState(null);

            // Form states
            const [newCategory, setNewCategory] = useState({ name: '', icon: '' });
            const [newQA, setNewQA] = useState({
                question: '',
                answer: '',
                description: '',
                keyPhrases: '',
                code: '',
                category: categories[0]?.id || 'general'
            });
            const [nextId, setNextId] = useState(3);

            // Initialize chat
            useEffect(() => {
                setChatMessages([{
                    type: 'bot',
                    text: 'Hi! I\'m Clippy. Ask me questions or browse Q&A with code snippets.'
                }]);
            }, []);

            // Filter items
            const getFilteredItems = () => {
                let filtered = qaItems;
                if (selectedCategory !== 'all') {
                    filtered = filtered.filter(item => item.category === selectedCategory);
                }
                if (searchTerm) {
                    const term = searchTerm.toLowerCase();
                    filtered = filtered.filter(item =>
                        item.question.toLowerCase().includes(term) ||
                        item.answer.toLowerCase().includes(term) ||
                        item.description.toLowerCase().includes(term) ||
                        (item.keyPhrases && item.keyPhrases.toLowerCase().includes(term)) ||
                        (item.code && item.code.toLowerCase().includes(term))
                    );
                }
                return filtered;
            };

            // Find answer
            const findAnswer = (userInput) => {
                const input = userInput.toLowerCase();
                let bestMatch = null;
                let bestScore = 0;

                qaItems.forEach(item => {
                    let score = 0;
                    if (item.question.toLowerCase().includes(input)) score += 3;
                    if (item.keyPhrases && item.keyPhrases.toLowerCase().includes(input)) score += 2;
                    if (item.code && item.code.toLowerCase().includes(input)) score += 2;
                    if (item.description.toLowerCase().includes(input)) score += 1;
                    if (item.answer.toLowerCase().includes(input)) score += 1;

                    if (score > bestScore) {
                        bestScore = score;
                        bestMatch = item;
                    }
                });

                return bestMatch ? bestMatch.answer : "I couldn't find an answer to that question.";
            };

            // Chat submit
            const handleChatSubmit = (e) => {
                e.preventDefault();
                if (!chatInput.trim()) return;

                const newMessages = [...chatMessages, { type: 'user', text: chatInput }];
                const answer = findAnswer(chatInput);
                newMessages.push({ type: 'bot', text: answer });

                setChatMessages(newMessages);
                setChatInput('');
            };

            // Add category
            const handleAddCategory = (e) => {
                e.preventDefault();
                if (!newCategory.name.trim()) return;

                const id = newCategory.name.toLowerCase().replace(/\s+/g, '_');
                setCategories([...categories, {
                    id,
                    name: newCategory.name,
                    icon: newCategory.icon || '📌'
                }]);
                setNewCategory({ name: '', icon: '' });
                alert('✅ Category added!');
            };

            // Add Q&A with CODE field
            const handleAddQA = (e) => {
                e.preventDefault();
                if (!newQA.question.trim() || !newQA.answer.trim()) return;

                setQaItems([...qaItems, {
                    id: nextId,
                    category: newQA.category,
                    question: newQA.question,
                    answer: newQA.answer,
                    description: newQA.description,
                    keyPhrases: newQA.keyPhrases,
                    code: newQA.code || ''
                }]);
                setNextId(nextId + 1);
                setNewQA({
                    question: '',
                    answer: '',
                    description: '',
                    keyPhrases: '',
                    code: '',
                    category: categories[0]?.id || 'general'
                });
                alert('✅ Q&A item added!');
            };

            // Copy code to clipboard
            const copyCode = (code, id) => {
                navigator.clipboard.writeText(code).then(() => {
                    setCopiedId(id);
                    setTimeout(() => setCopiedId(null), 2000);
                });
            };

            // Delete Q&A
            const handleDeleteQA = (id) => {
                if (confirm('Delete this Q&A?')) {
                    setQaItems(qaItems.filter(item => item.id !== id));
                    alert('✅ Q&A deleted!');
                }
            };

            // Export data with CODE field
            const handleExport = () => {
                const data = { categories, qaItems };
                const json = JSON.stringify(data, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `clippy-qa-code-${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                alert('✅ Data exported!');
            };

            // Import PVA topics
            const handlePVAImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const pvaData = JSON.parse(event.target.result);

                        // Support single topic, array of topics, or { topics: [...] }
                        let topics = [];
                        if (Array.isArray(pvaData)) {
                            topics = pvaData;
                        } else if (pvaData.topics && Array.isArray(pvaData.topics)) {
                            topics = pvaData.topics;
                        } else if (pvaData.name !== undefined) {
                            topics = [pvaData];
                        } else {
                            alert('❌ Could not find topics in the PVA JSON. Expected a topic object, an array of topics, or { "topics": [...] }.');
                            return;
                        }

                        if (topics.length === 0) {
                            alert('❌ No topics found in the PVA JSON file.');
                            return;
                        }

                        // Ensure the PVA Import category exists
                        const pvaCategoryId = 'pva_import';
                        setCategories(prev => {
                            if (prev.some(c => c.id === pvaCategoryId)) return prev;
                            return [...prev, { id: pvaCategoryId, name: 'PVA Import', icon: '🤖' }];
                        });

                        // Convert each PVA topic to a Clippy Q&A item
                        setQaItems(prev => {
                            const startId = Math.max(0, ...prev.map(i => i.id)) + 1;
                            const newItems = topics.map((topic, index) => {
                                // Collect text from all Message-type nodes as the answer
                                let answer = '';
                                if (topic.nodes && Array.isArray(topic.nodes)) {
                                    const messageParts = topic.nodes
                                        .filter(n => {
                                            const t = (n.type || '').toLowerCase();
                                            return t === 'message' || t === 'sendmessage';
                                        })
                                        .map(n => n.properties?.text || n.properties?.message || n.text || '')
                                        .filter(t => t.trim());
                                    answer = messageParts.join(' ');
                                }
                                // Fallback to description or topic name if no message nodes found
                                if (!answer) answer = topic.description || topic.name || '';

                                const keyPhrases = Array.isArray(topic.triggerPhrases)
                                    ? topic.triggerPhrases.join(', ')
                                    : (topic.triggerPhrases || '');

                                return {
                                    id: startId + index,
                                    category: pvaCategoryId,
                                    question: topic.name || `Imported Topic ${startId + index}`,
                                    answer: answer || 'No answer content found in topic nodes.',
                                    description: topic.description || '',
                                    keyPhrases,
                                    code: ''
                                };
                            });
                            return [...prev, ...newItems];
                        });

                        setNextId(prev => prev + topics.length);
                        alert(`✅ Imported ${topics.length} PVA topic(s) successfully! Check the "PVA Import" category.`);
                    } catch (error) {
                        alert('❌ Error importing PVA file. Make sure it\'s valid JSON. ' + error.message);
                    }
                };
                reader.readAsText(file);
            };

            // Import data
            const handleImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const imported = JSON.parse(event.target.result);
                        if (imported.categories) setCategories(imported.categories);
                        if (imported.qaItems) {
                            setQaItems(imported.qaItems);
                            const maxId = Math.max(...imported.qaItems.map(item => item.id), 0);
                            setNextId(maxId + 1);
                        }
                        alert('✅ Data imported successfully!');
                    } catch (error) {
                        alert('❌ Error importing file. Make sure it\'s valid JSON.');
                    }
                };
                reader.readAsText(file);
            };

            const filteredItems = getFilteredItems();

            return React.createElement('div', { className: 'min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100' },
                // Header
                React.createElement('header', { className: 'bg-white shadow-md border-b-4 border-indigo-600 sticky top-0 z-50' },
                    React.createElement('div', { className: 'max-w-7xl mx-auto px-6 py-4' },
                        React.createElement('div', { className: 'flex items-center justify-between' },
                            React.createElement('div', { className: 'flex items-center gap-3' },
                                React.createElement('div', { className: 'text-3xl' }, '📎'),
                                React.createElement('div', null,
                                    React.createElement('h1', { className: 'text-2xl font-bold text-indigo-600' }, 'Clippy Q&A'),
                                    React.createElement('p', { className: 'text-xs text-gray-600' }, 'Code Edition')
                                )
                            ),
                            React.createElement('div', { className: 'flex gap-2' },
                                React.createElement('button', {
                                    onClick: () => setViewMode('chat'),
                                    className: `px-4 py-2 rounded-lg transition-all ${viewMode === 'chat' ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`
                                }, '💬 Chat'),
                                React.createElement('button', {
                                    onClick: () => setViewMode('list'),
                                    className: `px-4 py-2 rounded-lg transition-all ${viewMode === 'list' ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`
                                }, '📋 Browse'),
                                React.createElement('button', {
                                    onClick: () => setViewMode('admin'),
                                    className: `px-4 py-2 rounded-lg transition-all ${viewMode === 'admin' ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`
                                }, '⚙️ Admin')
                            )
                        )
                    )
                ),

                // Main Content
                React.createElement('main', { className: 'max-w-7xl mx-auto px-6 py-8' },
                    // Search
                    (viewMode === 'chat' || viewMode === 'list') && React.createElement('div', { className: 'mb-6' },
                        React.createElement('div', { className: 'flex items-center gap-2 bg-white px-4 py-3 rounded-lg shadow-md border-2 border-indigo-200' },
                            React.createElement('span', null, '🔍'),
                            React.createElement('input', {
                                type: 'text',
                                placeholder: 'Search questions, code, phrases, descriptions...',
                                value: searchTerm,
                                onChange: (e) => setSearchTerm(e.target.value),
                                className: 'flex-1 outline-none text-lg'
                            })
                        ),
                        searchTerm && React.createElement('p', { className: 'text-sm text-gray-600 mt-2' }, `Found ${filteredItems.length} result${filteredItems.length !== 1 ? 's' : ''}`)
                    ),

                    // Category Filter
                    viewMode === 'list' && React.createElement('div', { className: 'mb-6 flex flex-wrap gap-2' },
                        React.createElement('button', {
                            onClick: () => setSelectedCategory('all'),
                            className: `px-4 py-2 rounded-full transition-all font-medium ${selectedCategory === 'all' ? 'bg-indigo-600 text-white' : 'bg-white text-gray-700 border-2 border-indigo-200 hover:border-indigo-600'}`
                        }, 'All Topics'),
                        categories.map(cat =>
                            React.createElement('button', {
                                key: cat.id,
                                onClick: () => setSelectedCategory(cat.id),
                                className: `px-4 py-2 rounded-full transition-all font-medium ${selectedCategory === cat.id ? 'bg-indigo-600 text-white' : 'bg-white text-gray-700 border-2 border-indigo-200 hover:border-indigo-600'}`
                            }, `${cat.icon} ${cat.name}`)
                        )
                    ),

                    // CHAT MODE
                    viewMode === 'chat' && React.createElement('div', { className: 'flex flex-col h-[600px] bg-white rounded-lg shadow-lg border-2 border-indigo-200 overflow-hidden' },
                        React.createElement('div', { className: 'flex-1 overflow-y-auto p-6 space-y-4' },
                            chatMessages.map((msg, idx) =>
                                React.createElement('div', {
                                    key: idx,
                                    className: `flex ${msg.type === 'user' ? 'justify-end' : 'justify-start'}`
                                },
                                    React.createElement('div', {
                                        className: `max-w-md px-4 py-3 rounded-lg ${msg.type === 'user' ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-gray-100 text-gray-800 rounded-bl-none'}`
                                    }, msg.text)
                                )
                            )
                        ),
                        React.createElement('form', { onSubmit: handleChatSubmit, className: 'border-t-2 border-indigo-200 p-4 bg-gray-50' },
                            React.createElement('div', { className: 'flex gap-2' },
                                React.createElement('input', {
                                    type: 'text',
                                    value: chatInput,
                                    onChange: (e) => setChatInput(e.target.value),
                                    placeholder: 'Ask a question...',
                                    className: 'flex-1 px-4 py-2 border-2 border-indigo-200 rounded-lg focus:outline-none focus:border-indigo-600'
                                }),
                                React.createElement('button', {
                                    type: 'submit',
                                    className: 'bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 transition-colors font-medium'
                                }, '✉️ Send')
                            )
                        )
                    ),

                    // LIST MODE
                    viewMode === 'list' && React.createElement('div', { className: 'space-y-3' },
                        filteredItems.length > 0 ? (
                            filteredItems.map(item =>
                                React.createElement('div', {
                                    key: item.id,
                                    className: 'bg-white rounded-lg shadow-md border-2 border-indigo-200 overflow-hidden hover:shadow-lg transition-shadow'
                                },
                                    React.createElement('button', {
                                        onClick: () => setExpandedItems(prev => ({ ...prev, [item.id]: !prev[item.id] })),
                                        className: 'w-full px-6 py-4 flex items-center justify-between hover:bg-indigo-50 transition-colors'
                                    },
                                        React.createElement('div', { className: 'text-left' },
                                            React.createElement('p', { className: 'font-semibold text-gray-800 text-lg' }, item.question),
                                            React.createElement('p', { className: 'text-sm text-indigo-600 mt-1' }, categories.find(c => c.id === item.category)?.name),
                                            item.code && React.createElement('p', { className: 'text-xs text-orange-600 mt-1' }, '📝 Has code snippet')
                                        ),
                                        React.createElement('span', { className: 'text-indigo-600' }, expandedItems[item.id] ? '▲' : '▼')
                                    ),
                                    expandedItems[item.id] && React.createElement('div', { className: 'border-t-2 border-indigo-200 px-6 py-4 bg-indigo-50 space-y-4' },
                                        React.createElement('div', null,
                                            React.createElement('p', { className: 'text-gray-700 font-semibold mb-2' }, 'Answer:'),
                                            React.createElement('p', { className: 'text-gray-700' }, item.answer)
                                        ),
                                        item.description && React.createElement('div', null,
                                            React.createElement('p', { className: 'text-gray-600 text-sm' }, '📝 ', item.description)
                                        ),
                                        item.keyPhrases && React.createElement('div', null,
                                            React.createElement('p', { className: 'text-gray-600 text-sm' }, '🔑 Key phrases: ', item.keyPhrases)
                                        ),
                                        item.code && React.createElement('div', null,
                                            React.createElement('div', { className: 'flex items-center justify-between mb-2' },
                                                React.createElement('p', { className: 'font-semibold text-gray-800' }, '💻 Code:'),
                                                React.createElement('button', {
                                                    onClick: () => copyCode(item.code, item.id),
                                                    className: `px-3 py-1 rounded text-sm transition-all ${copiedId === item.id ? 'bg-green-500 text-white' : 'bg-gray-200 hover:bg-gray-300'}`
                                                }, copiedId === item.id ? '✅ Copied!' : '📋 Copy')
                                            ),
                                            React.createElement('pre', { className: 'bg-gray-900 text-gray-100 p-4 rounded overflow-x-auto text-sm font-mono' },
                                                React.createElement('code', null, item.code)
                                            )
                                        )
                                    )
                                )
                            )
                        ) : (
                            React.createElement('div', { className: 'text-center py-12' },
                                React.createElement('p', { className: 'text-xl text-gray-600' }, 'No results found.')
                            )
                        )
                    ),

                    // ADMIN MODE
                    viewMode === 'admin' && React.createElement('div', { className: 'grid grid-cols-1 lg:grid-cols-2 gap-6' },
                        // Add Category
                        React.createElement('div', { className: 'bg-white rounded-lg shadow-lg border-2 border-indigo-200 p-6' },
                            React.createElement('h2', { className: 'text-2xl font-bold text-indigo-600 mb-4' }, '➕ Add Category'),
                            React.createElement('form', { onSubmit: handleAddCategory, className: 'space-y-4' },
                                React.createElement('input', {
                                    type: 'text',
                                    placeholder: 'Category name',
                                    value: newCategory.name,
                                    onChange: (e) => setNewCategory({ ...newCategory, name: e.target.value }),
                                    className: 'w-full px-4 py-2 border-2 border-indigo-200 rounded-lg focus:outline-none focus:border-indigo-600'
                                }),
                                React.createElement('input', {
                                    type: 'text',
                                    placeholder: 'Emoji icon',
                                    value: newCategory.icon,
                                    onChange: (e) => setNewCategory({ ...newCategory, icon: e.target.value }),
                                    className: 'w-full px-4 py-2 border-2 border-indigo-200 rounded-lg focus:outline-none focus:border-indigo-600',
                                    maxLength: '2'
                                }),
                                React.createElement('button', {
                                    type: 'submit',
                                    className: 'w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 font-bold'
                                }, '✅ Add')
                            )
                        ),

                        // Add Q&A with CODE field
                        React.createElement('div', { className: 'bg-white rounded-lg shadow-lg border-2 border-indigo-200 p-6' },
                            React.createElement('h2', { className: 'text-2xl font-bold text-indigo-600 mb-4' }, '➕ Add Q&A'),
                            React.createElement('form', { onSubmit: handleAddQA, className: 'space-y-4 max-h-96 overflow-y-auto' },
                                React.createElement('select', {
                                    value: newQA.category,
                                    onChange: (e) => setNewQA({ ...newQA, category: e.target.value }),
                                    className: 'w-full px-4 py-2 border-2 border-indigo-200 rounded-lg focus:outline-none focus:border-indigo-600'
                                },
                                    categories.map(cat =>
                                        React.createElement('option', { key: cat.id, value: cat.id }, cat.name)
                                    )
                                ),
                                React.createElement('textarea', {
                                    placeholder: 'Question',
                                    value: newQA.question,
                                    onChange: (e) => setNewQA({ ...newQA, question: e.target.value }),
                                    className: 'w-full px-4 py-2 border-2 border-indigo-200 rounded-lg focus:outline-none focus:border-indigo-600',
                                    rows: '2'
                                }),
                                React.createElement('textarea', {
                                    placeholder: 'Answer',
                                    value: newQA.answer,
                                    onChange: (e) => setNewQA({ ...newQA, answer: e.target.value }),
                                    className: 'w-full px-4 py-2 border-2 border-indigo-200 rounded-lg focus:outline-none focus:border-indigo-600',
                                    rows: '3'
                                }),
                                React.createElement('textarea', {
                                    placeholder: 'Description/Details',
                                    value: newQA.description,
                                    onChange: (e) => setNewQA({ ...newQA, description: e.target.value }),
                                    className: 'w-full px-4 py-2 border-2 border-indigo-200 rounded-lg focus:outline-none focus:border-indigo-600',
                                    rows: '2'
                                }),
                                React.createElement('textarea', {
                                    placeholder: 'Key phrases (comma-separated)',
                                    value: newQA.keyPhrases,
                                    onChange: (e) => setNewQA({ ...newQA, keyPhrases: e.target.value }),
                                    className: 'w-full px-4 py-2 border-2 border-indigo-200 rounded-lg focus:outline-none focus:border-indigo-600',
                                    rows: '2'
                                }),
                                React.createElement('textarea', {
                                    placeholder: 'Code/JavaScript (optional)',
                                    value: newQA.code,
                                    onChange: (e) => setNewQA({ ...newQA, code: e.target.value }),
                                    className: 'w-full px-4 py-2 border-2 border-orange-300 rounded-lg focus:outline-none focus:border-orange-600 font-mono text-sm',
                                    rows: '4'
                                }),
                                React.createElement('button', {
                                    type: 'submit',
                                    className: 'w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 font-bold'
                                }, '✅ Add Q&A')
                            )
                        ),

                        // Export/Import
                        React.createElement('div', { className: 'lg:col-span-2 bg-white rounded-lg shadow-lg border-2 border-indigo-200 p-6' },
                            React.createElement('h2', { className: 'text-2xl font-bold text-indigo-600 mb-4' }, '💾 Data Management'),
                            React.createElement('div', { className: 'grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4' },
                                React.createElement('button', {
                                    onClick: handleExport,
                                    className: 'bg-green-600 text-white py-3 rounded-lg hover:bg-green-700 font-bold'
                                }, '⬇️ Export JSON'),
                                React.createElement('div', null,
                                    React.createElement('label', { className: 'block w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 font-bold text-center cursor-pointer' },
                                        '⬆️ Import JSON',
                                        React.createElement('input', {
                                            type: 'file',
                                            accept: '.json',
                                            onChange: handleImport,
                                            className: 'hidden'
                                        })
                                    )
                                ),
                                React.createElement('div', null,
                                    React.createElement('label', { className: 'block w-full bg-purple-600 text-white py-3 rounded-lg hover:bg-purple-700 font-bold text-center cursor-pointer' },
                                        '🤖 Import PVA Topics',
                                        React.createElement('input', {
                                            type: 'file',
                                            accept: '.json',
                                            onChange: handlePVAImport,
                                            className: 'hidden'
                                        })
                                    )
                                )
                            ),
                            React.createElement('p', { className: 'text-sm text-gray-600 mt-4' }, '💡 Export/Import: save and restore Clippy Q&A data. Import PVA Topics: migrate topics from a Power Virtual Agents JSON export into the "PVA Import" category.')
                        ),

                        // Current Items
                        React.createElement('div', { className: 'lg:col-span-2 bg-white rounded-lg shadow-lg border-2 border-indigo-200 p-6' },
                            React.createElement('h2', { className: 'text-2xl font-bold text-indigo-600 mb-4' }, `📚 Q&A Items (${qaItems.length})`),
                            React.createElement('div', { className: 'space-y-2 max-h-80 overflow-y-auto' },
                                qaItems.map(item =>
                                    React.createElement('div', {
                                        key: item.id,
                                        className: 'bg-gray-100 p-3 rounded border-l-4 border-indigo-600'
                                    },
                                        React.createElement('div', { className: 'flex justify-between items-start' },
                                            React.createElement('div', { className: 'flex-1' },
                                                React.createElement('p', { className: 'font-semibold text-gray-800' }, item.question),
                                                React.createElement('p', { className: 'text-xs text-gray-600' }, categories.find(c => c.id === item.category)?.name),
                                                item.code && React.createElement('p', { className: 'text-xs text-orange-600 mt-1' }, '📝 Code: ' + item.code.substring(0, 30) + '...')
                                            ),
                                            React.createElement('button', {
                                                onClick: () => handleDeleteQA(item.id),
                                                className: 'text-red-600 hover:text-red-800 font-bold'
                                            }, '🗑️')
                                        )
                                    )
                                )
                            )
                        )
                    )
                )
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(ClippyQACodeEdition));
    </script>
</body>
</html>
