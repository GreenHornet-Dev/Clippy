<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clippy Q&A - Powered by React</title>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/umd/lucide.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        // Q&A Data embedded in the page
        const qaData = {
            categories: [
                { id: "general", name: "General Questions", icon: "🤔" },
                { id: "technical", name: "Technical Support", icon: "⚙️" },
                { id: "account", name: "Account & Billing", icon: "💳" },
                { id: "features", name: "Features & Usage", icon: "✨" }
            ],
            qaItems: [
                {
                    id: 1,
                    category: "general",
                    question: "What is this application?",
                    answer: "This is a Q&A chatbot application built to provide quick answers to common questions. You can search, browse by category, or chat with the bot."
                },
                {
                    id: 2,
                    category: "features",
                    question: "How do I search for questions?",
                    answer: "Use the search box at the top to find questions by keyword. Results update in real-time as you type."
                },
                {
                    id: 3,
                    category: "account",
                    question: "Is my data private?",
                    answer: "Yes, this application runs locally in your browser. No data is sent to external servers."
                },
                {
                    id: 4,
                    category: "technical",
                    question: "What browsers are supported?",
                    answer: "This app works on all modern browsers including Chrome, Firefox, Safari, and Edge."
                },
                {
                    id: 5,
                    category: "features",
                    question: "Can I add more questions?",
                    answer: "Yes! Edit the qa-data.json file or modify the qaItems array in this HTML file to add new questions and answers."
                },
                {
                    id: 6,
                    category: "general",
                    question: "How do I get started?",
                    answer: "Browse questions by category, use search, or start typing in the chat interface to ask questions."
                }
            ]
        };

        const { useState, useEffect } = React;

        const ClippyQAApp = () => {
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('all');
            const [viewMode, setViewMode] = useState('chat');
            const [chatMessages, setChatMessages] = useState([]);
            const [chatInput, setChatInput] = useState('');
            const [expandedItems, setExpandedItems] = useState({});

            useEffect(() => {
                setChatMessages([{
                    type: 'bot',
                    text: 'Hi! I\'m Clippy. Ask me any question or browse questions below.'
                }]);
            }, []);

            const getFilteredItems = () => {
                let filtered = qaData.qaItems;
                if (selectedCategory !== 'all') {
                    filtered = filtered.filter(item => item.category === selectedCategory);
                }
                if (searchTerm) {
                    filtered = filtered.filter(item =>
                        item.question.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        item.answer.toLowerCase().includes(searchTerm.toLowerCase())
                    );
                }
                return filtered;
            };

            const findAnswer = (userInput) => {
                const input = userInput.toLowerCase();
                const match = qaData.qaItems.find(item =>
                    item.question.toLowerCase().includes(input) ||
                    item.answer.toLowerCase().includes(input)
                );
                return match ? match.answer : "I couldn't find an answer to that question. Try searching our Q&A list or browsing by category.";
            };

            const handleChatSubmit = (e) => {
                e.preventDefault();
                if (!chatInput.trim()) return;

                const newMessages = [...chatMessages, { type: 'user', text: chatInput }];
                const answer = findAnswer(chatInput);
                newMessages.push({ type: 'bot', text: answer });

                setChatMessages(newMessages);
                setChatInput('');
            };

            const toggleExpanded = (id) => {
                setExpandedItems(prev => ({ ...prev, [id]: !prev[id] }));
            };

            const filteredItems = getFilteredItems();

            return (
                React.createElement('div', { className: 'min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100' },
                    // Header
                    React.createElement('header', { className: 'bg-white shadow-md border-b-4 border-indigo-600' },
                        React.createElement('div', { className: 'max-w-6xl mx-auto px-6 py-4' },
                            React.createElement('div', { className: 'flex items-center justify-between' },
                                React.createElement('div', { className: 'flex items-center gap-3' },
                                    React.createElement('div', { className: 'text-3xl' }, '📎'),
                                    React.createElement('h1', { className: 'text-3xl font-bold text-indigo-600' }, 'Clippy Q&A')
                                ),
                                React.createElement('div', { className: 'flex gap-2' },
                                    React.createElement('button', {
                                        onClick: () => setViewMode('chat'),
                                        className: `flex items-center gap-2 px-4 py-2 rounded-lg transition-all ${viewMode === 'chat' ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`
                                    }, '💬 Chat'),
                                    React.createElement('button', {
                                        onClick: () => setViewMode('list'),
                                        className: `flex items-center gap-2 px-4 py-2 rounded-lg transition-all ${viewMode === 'list' ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`
                                    }, '📋 Browse')
                                )
                            )
                        )
                    ),

                    // Main Content
                    React.createElement('main', { className: 'max-w-6xl mx-auto px-6 py-8' },
                        // Search Bar
                        React.createElement('div', { className: 'mb-6' },
                            React.createElement('div', { className: 'flex items-center gap-2 bg-white px-4 py-3 rounded-lg shadow-md border-2 border-indigo-200' },
                                React.createElement('span', null, '🔍'),
                                React.createElement('input', {
                                    type: 'text',
                                    placeholder: 'Search questions...',
                                    value: searchTerm,
                                    onChange: (e) => setSearchTerm(e.target.value),
                                    className: 'flex-1 outline-none text-lg'
                                })
                            ),
                            searchTerm && React.createElement('p', { className: 'text-sm text-gray-600 mt-2' }, `Found ${filteredItems.length} result${filteredItems.length !== 1 ? 's' : ''}`)
                        ),

                        // Category Filter
                        viewMode === 'list' && React.createElement('div', { className: 'mb-6 flex flex-wrap gap-2' },
                            React.createElement('button', {
                                onClick: () => setSelectedCategory('all'),
                                className: `px-4 py-2 rounded-full transition-all font-medium ${selectedCategory === 'all' ? 'bg-indigo-600 text-white' : 'bg-white text-gray-700 border-2 border-indigo-200 hover:border-indigo-600'}`
                            }, 'All Topics'),
                            qaData.categories.map(cat =>
                                React.createElement('button', {
                                    key: cat.id,
                                    onClick: () => setSelectedCategory(cat.id),
                                    className: `px-4 py-2 rounded-full transition-all font-medium ${selectedCategory === cat.id ? 'bg-indigo-600 text-white' : 'bg-white text-gray-700 border-2 border-indigo-200 hover:border-indigo-600'}`
                                }, `${cat.icon} ${cat.name}`)
                            )
                        ),

                        // Chat or List View
                        viewMode === 'chat' ? (
                            React.createElement('div', { className: 'flex flex-col h-[600px] bg-white rounded-lg shadow-lg border-2 border-indigo-200 overflow-hidden' },
                                React.createElement('div', { className: 'flex-1 overflow-y-auto p-6 space-y-4' },
                                    chatMessages.map((msg, idx) =>
                                        React.createElement('div', {
                                            key: idx,
                                            className: `flex ${msg.type === 'user' ? 'justify-end' : 'justify-start'}`
                                        },
                                            React.createElement('div', {
                                                className: `max-w-xs px-4 py-3 rounded-lg ${msg.type === 'user' ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-gray-100 text-gray-800 rounded-bl-none'}`
                                            }, msg.text)
                                        )
                                    )
                                ),
                                React.createElement('form', { onSubmit: handleChatSubmit, className: 'border-t-2 border-indigo-200 p-4 bg-gray-50' },
                                    React.createElement('div', { className: 'flex gap-2' },
                                        React.createElement('input', {
                                            type: 'text',
                                            value: chatInput,
                                            onChange: (e) => setChatInput(e.target.value),
                                            placeholder: 'Ask a question...',
                                            className: 'flex-1 px-4 py-2 border-2 border-indigo-200 rounded-lg focus:outline-none focus:border-indigo-600'
                                        }),
                                        React.createElement('button', {
                                            type: 'submit',
                                            className: 'bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 transition-colors font-medium'
                                        }, '✉️ Send')
                                    )
                                )
                            )
                        ) : (
                            React.createElement('div', { className: 'space-y-3' },
                                filteredItems.length > 0 ? (
                                    filteredItems.map(item =>
                                        React.createElement('div', {
                                            key: item.id,
                                            className: 'bg-white rounded-lg shadow-md border-2 border-indigo-200 overflow-hidden hover:shadow-lg transition-shadow'
                                        },
                                            React.createElement('button', {
                                                onClick: () => toggleExpanded(item.id),
                                                className: 'w-full px-6 py-4 flex items-center justify-between hover:bg-indigo-50 transition-colors'
                                            },
                                                React.createElement('div', { className: 'text-left' },
                                                    React.createElement('p', { className: 'font-semibold text-gray-800 text-lg' }, item.question),
                                                    React.createElement('p', { className: 'text-sm text-indigo-600 mt-1' }, qaData.categories.find(c => c.id === item.category)?.name)
                                                ),
                                                React.createElement('span', { className: 'text-indigo-600 transition-transform' }, expandedItems[item.id] ? '▲' : '▼')
                                            ),
                                            expandedItems[item.id] && React.createElement('div', { className: 'border-t-2 border-indigo-200 px-6 py-4 bg-indigo-50' },
                                                React.createElement('p', { className: 'text-gray-700' }, item.answer)
                                            )
                                        )
                                    )
                                ) : (
                                    React.createElement('div', { className: 'text-center py-12' },
                                        React.createElement('p', { className: 'text-xl text-gray-600' }, 'No questions match your search.'),
                                        React.createElement('p', { className: 'text-gray-500 mt-2' }, 'Try different keywords or browse by category.')
                                    )
                                )
                            )
                        )
                    )
                )
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(ClippyQAApp));
    </script>
</body>
</html>
